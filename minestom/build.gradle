plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'uk.minersonline.cloudinator.minestom'
version = '1.0-SNAPSHOT'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    compileOnly 'net.minestom:minestom-snapshots:19c4b5d598'
    testImplementation 'net.minestom:minestom-snapshots:19c4b5d598'

    implementation project(":common")
    implementation "net.ME1312.SubData:Client:23w08b"
    implementation "net.ME1312.Galaxi:GalaxiAPI:23w51b"
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier.set('all')
    mergeServiceFiles()
}